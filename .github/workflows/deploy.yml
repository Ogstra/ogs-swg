name: Build and Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'frontend/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Go vuln check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Frontend install
        run: npm ci
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Frontend audit (high+)
        run: npm audit --audit-level=high
        working-directory: frontend

  build-and-push:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ogs-swg:latest
          platforms: ${{ secrets.DEPLOY_ARCH || 'linux/amd64,linux/arm64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.yml"
          target: "${{ secrets.DEPLOY_PATH }}"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Navigate to deployment directory (create if missing)
            mkdir -p ${{ secrets.DEPLOY_PATH }}/config
            mkdir -p ${{ secrets.DEPLOY_PATH }}/data
            # Ensure system config directories exist
            sudo mkdir -p /etc/sing-box
            sudo mkdir -p /etc/wireguard
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Clean up potential directory conflict
            rm -f config/ssh_key
            rm -f config/known_hosts
            
            # Write SSH Key to file (for the container to use)
            echo "${{ secrets.OGS_AGENT_SSH_KEY }}" > config/ssh_key
            chmod 600 config/ssh_key
            echo "${{ secrets.OGS_SSH_KNOWN_HOSTS_CONTENT }}" > config/known_hosts
            chmod 600 config/known_hosts
            
            # Create .env from secrets (Optional but recommended)
            echo "OGS_LISTEN_ADDR=:8080" > .env
            echo "OGS_IMAGE=${{ secrets.DOCKER_USERNAME }}/ogs-swg:latest" >> .env
            echo "OGS_PORT=${{ secrets.OGS_PORT }}" >> .env
            echo "OGS_DB_PATH=/app/data/stats.db" >> .env
            echo "OGS_ACCESS_LOG_PATH=/app/data/access.log" >> .env
            echo "OGS_SSH_HOST=${{ secrets.VPS_HOST }}" >> .env
            echo "OGS_SSH_PORT=${{ secrets.VPS_PORT }}" >> .env
            echo "OGS_SSH_USER=${{ secrets.OGS_AGENT_USER }}" >> .env
            echo "OGS_SSH_KEY_PATH=/app/secrets/ssh_key" >> .env
            echo "OGS_SSH_KNOWN_HOSTS=/app/secrets/known_hosts" >> .env
            echo "OGS_ADMIN_USER=${{ secrets.OGS_ADMIN_USER }}" >> .env
            echo "OGS_ADMIN_PASSWORD=${{ secrets.OGS_ADMIN_PASSWORD }}" >> .env
            # Key Passphrase if needed
            # echo "OGS_SSH_KEY_PASS=${{ secrets.SSH_KEY_PASS }}" >> .env

            # Pull and Restart
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
