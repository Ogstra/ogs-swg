services:
  ogs-swg-demo:
    build: .
    image: ogs-swg:demo
    container_name: ogs-swg-demo
    restart: unless-stopped
    ports:
      - "${OGS_DEMO_PORT:-8119}:8080"
    environment:
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
      - OGS_API_KEY=${OGS_API_KEY:-demo-readonly-key}
      - OGS_API_KEY_READ_ONLY=true
      - OGS_DEMO_MODE=true
      - OGS_DISABLE_PASSWORD_LOGIN=true
      - OGS_PUBLIC_IP=203.0.113.10
      - DEMO_MIN_TOTAL_GB=${DEMO_MIN_TOTAL_GB:-40}
      - DEMO_MAX_TOTAL_GB=${DEMO_MAX_TOTAL_GB:-100}
      - DEMO_SEED_INTERVAL_SEC=${DEMO_SEED_INTERVAL_SEC:-300}
      - DEMO_LIVE_INTERVAL_SEC=${DEMO_LIVE_INTERVAL_SEC:-60}
      - DEMO_LOG_INTERVAL_SEC=${DEMO_LOG_INTERVAL_SEC:-3}
      - DEMO_RETENTION_SECONDS=${DEMO_RETENTION_SECONDS:-172800}
    volumes:
      - ./docker/demo:/demo:ro
      - ./data-demo:/app/data
    command: ["/bin/bash", "/demo/start-demo.sh"]
