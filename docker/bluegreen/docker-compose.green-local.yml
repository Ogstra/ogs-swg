# OGS-SWG — green slot (docker_local mode)
#
# Panel in Docker on the SAME host as sing-box/wg (systemd).
# No SSH connection needed — talks to host systemd via bind-mounted runtime sockets.
# Use this instead of docker-compose.green.yml when deploying locally.
#
# See DEPLOY_GITHUB_ACTIONS.md — Docker Local Mode section.

services:
  ogs-swg-green:
    image: ${OGS_IMAGE}
    container_name: ogs-swg-green
    restart: unless-stopped

    volumes:
      - ../../data:/app/data

      # Bind-mount at the same path as on the host
      - /etc/sing-box:/etc/sing-box
      - /etc/wireguard:/etc/wireguard
      - /run/dbus:/run/dbus
      - /run/systemd:/run/systemd
      - /var/log/journal:/var/log/journal:ro

    environment:
      - OGS_LISTEN_ADDR=:8080
      - OGS_DB_PATH=/app/data/stats.db
      - OGS_ACCESS_LOG_PATH=/app/data/access.log

      # Activates DockerLocalExecutor (host D-Bus mode)
      - OGS_EXECUTION_MODE=docker_local

      - OGS_API_KEY=${OGS_API_KEY}
      - OGS_ADMIN_USER=${OGS_ADMIN_USER}
      - OGS_ADMIN_PASSWORD=${OGS_ADMIN_PASSWORD}

    networks:
      - ogs_bg_net

networks:
  ogs_bg_net:
    external: true
    name: ogs-bg-net
