services:
  ogs-swg-proxy:
    image: nginx:1.27-alpine
    container_name: ogs-swg-proxy
    restart: unless-stopped
    ports:
      - "${OGS_PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ogs_bg_net

networks:
  ogs_bg_net:
    external: true
    name: ogs-bg-net
