# OGS-SWG — Nginx reverse proxy (blue/green frontend)
#
# Routes public traffic to the currently active app slot.
# The upstream is rewritten by the deploy script on each promotion
# via nginx -s reload (zero-downtime).
#
# OGS_PROXY_HTTP_PORT: host port exposed to the internet (default 8080)

services:
  ogs-swg-proxy:
    image: nginx:1.27-alpine
    container_name: ogs-swg-proxy
    restart: unless-stopped
    ports:
      - "${OGS_PROXY_HTTP_PORT:-8080}:80"
    volumes:
      # Generated from default.conf.template by the deploy script
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ogs_bg_net

networks:
  ogs_bg_net:
    external: true
    name: ogs-bg-net
