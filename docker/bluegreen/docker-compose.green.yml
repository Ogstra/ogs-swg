# OGS-SWG — green slot (docker_local mode)
#
# Compatibility alias kept for older automation. Runtime SSH mode was removed;
# prefer docker-compose.green-local.yml for new deployments.

services:
  ogs-swg-green:
    image: ${OGS_IMAGE}
    container_name: ogs-swg-green
    restart: unless-stopped
    network_mode: host

    volumes:
      - ../../data:/app/data
      - ${OGS_ACCESS_LOG_HOST_DIR:-../../data}:/app/access-logs:ro
      - /etc/sing-box:/etc/sing-box
      - /etc/wireguard:/etc/wireguard
      - /run/dbus:/run/dbus
      - /run/systemd:/run/systemd
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro

    environment:
      - OGS_LISTEN_ADDR=:${OGS_SLOT_GREEN_PORT:-18081}
      - OGS_DB_PATH=/app/data/stats.db
      - OGS_ACCESS_LOG_PATH=${OGS_ACCESS_LOG_PATH:-/app/access-logs/access.log}
      - OGS_EXECUTION_MODE=docker_local
      - OGS_DOCKER_LOCAL_HOST_NETWORK=true
      - OGS_SINGBOX_BINARY_PATH=${OGS_SINGBOX_BINARY_PATH:-}
      - OGS_API_KEY=${OGS_API_KEY}
      - OGS_ADMIN_USER=${OGS_ADMIN_USER}
      - OGS_ADMIN_PASSWORD=${OGS_ADMIN_PASSWORD}
