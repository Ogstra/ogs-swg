# OGS-SWG — blue slot (docker_local mode)
#
# Panel in Docker on the SAME host as sing-box/wg (systemd).
# No SSH connection needed — uses nsenter -t 1 to reach host namespaces.
# Use this instead of docker-compose.blue.yml when deploying locally.
#
# See DEPLOY_GITHUB_ACTIONS.md — Docker Local Mode section.

services:
  ogs-swg-blue:
    image: ${OGS_IMAGE}
    container_name: ogs-swg-blue
    restart: unless-stopped

    # Host PID namespace — required so nsenter -t 1 targets the host init process
    pid: host

    cap_add:
      - SYS_PTRACE   # required for nsenter to enter host namespaces
      - SYS_ADMIN    # required for sysctl writes via nsenter

    volumes:
      - ../../data:/app/data

      # Bind-mount at the same path as on the host
      - /etc/sing-box:/etc/sing-box
      - /etc/wireguard:/etc/wireguard

    environment:
      - OGS_LISTEN_ADDR=:8080
      - OGS_DB_PATH=/app/data/stats.db
      - OGS_ACCESS_LOG_PATH=/app/data/access.log

      # Activates DockerLocalExecutor (nsenter-based)
      - OGS_EXECUTION_MODE=docker_local

      - OGS_API_KEY=${OGS_API_KEY}
      - OGS_ADMIN_USER=${OGS_ADMIN_USER}
      - OGS_ADMIN_PASSWORD=${OGS_ADMIN_PASSWORD}

    networks:
      - ogs_bg_net

networks:
  ogs_bg_net:
    external: true
    name: ogs-bg-net
