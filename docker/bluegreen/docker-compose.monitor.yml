# OGS-SWG — Watchdog / monitor
#
# Lightweight sidecar that manages the blue/green lifecycle:
#   - Stops the old slot after the baking window expires
#   - Polls the active slot health; rolls back to the previous slot on failure
#   - Restarts generic unhealthy containers (for example, the public demo)
#   - Logs all events to EVENTS_FILE
#
# The monitor needs the Docker socket to start/stop app containers,
# and read/write access to the deploy state files in DEPLOY_ROOT.

services:
  ogs-swg-monitor:
    build:
      context: ./monitor
      dockerfile: Dockerfile
    container_name: ogs-swg-monitor
    restart: unless-stopped
    mem_limit: 15m    # watchdog is intentionally lightweight
    cpus: 0.20

    environment:
      - EXECUTION_MODE=${OGS_EXECUTION_MODE:-docker_local}
      - SLOT_BLUE_PORT=${OGS_SLOT_BLUE_PORT:-18080}
      - SLOT_GREEN_PORT=${OGS_SLOT_GREEN_PORT:-18081}

      # Root directory where blue/green state files are stored
      - DEPLOY_ROOT=/state

      # State files (relative to DEPLOY_ROOT)
      - ACTIVE_FILE=.bluegreen.active          # current live slot (blue|green)
      - PREVIOUS_FILE=.bluegreen.previous      # previous slot (rollback target)
      - BAKE_UNTIL_FILE=.bluegreen.bake_until  # unix timestamp; old slot stopped after this
      - EVENTS_FILE=.bluegreen.events.log      # append-only incident log

      # Nginx config paths (used to rewrite upstream on rollback)
      - NGINX_TEMPLATE=docker/bluegreen/nginx/default.conf.template
      - NGINX_CONF=docker/bluegreen/nginx/default.conf

      # Health probe — polled on the active slot container
      - HEALTH_URL_PATH=/api/login             # endpoint path inside the app
      - HEALTH_METHOD=POST
      - HEALTH_BODY={"username":"invalid","password":"invalid"}
      - HEALTH_EXPECT=401,405                  # expected HTTP codes for a live app

      # Polling interval in seconds
      - CHECK_INTERVAL_SEC=15

      # Consecutive failures before triggering rollback
      - FAIL_THRESHOLD=4

      # Generic autoheal for containers with Docker healthcheck status=unhealthy.
      # Keep the blue/green slots, proxy, and monitor under their own control flow.
      - AUTOHEAL_ENABLED=true
      - AUTOHEAL_COOLDOWN_SEC=120
      - AUTOHEAL_IGNORE_REGEX=^ogs-swg-(blue|green|proxy|monitor)$

    volumes:
      # Docker socket — needed to start/stop blue and green containers
      - /var/run/docker.sock:/var/run/docker.sock

      # Deploy root — state files and nginx config live here
      - ../../:/state

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - ogs_bg_net

networks:
  ogs_bg_net:
    external: true
    name: ogs-bg-net
