# OGS-SWG — docker_local mode (standalone)
#
# Use when the panel runs as a Docker container on the SAME host as
# sing-box and wg-quick (systemd). File operations use bind mounts;
# system commands (systemctl, sysctl, journalctl, wg) are executed in
# host namespaces via `nsenter -t 1`.
#
# Prerequisites on the host:
#   - sing-box installed and running as a systemd service
#   - wg-quick@wg0 configured and running as a systemd service
#   - /etc/sing-box/ and /etc/wireguard/ directories exist
#
# Usage:
#   OGS_API_KEY=changeme docker compose up -d

services:
  ogs-swg:
    image: ${OGS_IMAGE:-yourusername/ogs-swg:latest}
    container_name: ogs-swg
    restart: unless-stopped

    # Host PID namespace — required so nsenter -t 1 targets the host init process
    pid: host

    cap_add:
      - SYS_PTRACE   # required for nsenter to enter host namespaces
      - SYS_ADMIN    # required for sysctl writes via nsenter

    volumes:
      - ../../data:/app/data

      # Bind-mount at the same path as on the host so file reads/writes
      # work identically to bare-metal (LocalExecutor delegates these directly)
      - /etc/sing-box:/etc/sing-box
      - /etc/wireguard:/etc/wireguard

    environment:
      - OGS_LISTEN_ADDR=:8080
      - OGS_DB_PATH=/app/data/stats.db

      # Activates DockerLocalExecutor (nsenter-based)
      - OGS_EXECUTION_MODE=docker_local

      - OGS_API_KEY=${OGS_API_KEY}

      # First-run admin bootstrap — remove after initial login
      - OGS_ADMIN_USER=${OGS_ADMIN_USER:-}
      - OGS_ADMIN_PASSWORD=${OGS_ADMIN_PASSWORD:-}

    ports:
      - "${OGS_PORT:-8080}:8080"
